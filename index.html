<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>퀸즈미라클 크리에이티브</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        color: white;
        text-align: center;
        padding: 20px;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      }
      h1 {
        font-size: 48px;
        margin-bottom: 20px;
      }
      p {
        font-size: 24px;
        opacity: 0.9;
      }
      .subtitle {
        font-size: 18px;
        margin-top: 20px;
        opacity: 0.8;
      }
    </style>
  </head>
  <body>
    <div>
      <h1>퀸즈미라클 크리에이티브</h1>
      <p>곧 오픈합니다!</p>
      <p class="subtitle">책 만들기 · 음악 만들기 · 숏츠 만들기</p>
    </div>
  </body>
</html>
